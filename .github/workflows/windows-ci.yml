name: Windows build and test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InkMotion.sln -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build InkMotion.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Test
        run: dotnet test InkMotion.sln -c Release -p:Platform=${{ matrix.platform }} --no-build --no-restore
