name: Windows build and test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up x86 .NET runtimes
        if: matrix.platform == 'x86'
        shell: pwsh
        run: |
          $runtimePath = "C:\Program Files (x86)\dotnet"
          $installerPath = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installerPath
          & $installerPath -Runtime dotnet -Channel 10.0 -Architecture x86 -InstallDir $runtimePath
          & $installerPath -Runtime windowsdesktop -Channel 10.0 -Architecture x86 -InstallDir $runtimePath

      - name: Restore
        run: dotnet restore InkMotion.sln -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build InkMotion.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Test x86
        if: matrix.platform == 'x86'
        shell: pwsh
        run: |
          $env:DOTNET_ROOT = "C:\Program Files (x86)\dotnet"
          dotnet test InkMotion.sln -c Release -p:Platform=x86 --no-build --no-restore

      - name: Test x64
        if: matrix.platform == 'x64'
        run: dotnet test InkMotion.sln -c Release -p:Platform=${{ matrix.platform }} --no-build --no-restore

      - name: Publish portable build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP "InkMotion-win-${{ matrix.platform }}"
          dotnet publish src\InkMotion\InkMotion.csproj -c Release -p:Platform=${{ matrix.platform }} -r win-${{ matrix.platform }} --self-contained -o $output
          if (-not (Test-Path (Join-Path $output 'InkMotion.pri'))) { throw "The published app is missing InkMotion.pri." }
          7z a -tzip -mx=7 "InkMotion-win-${{ matrix.platform }}.zip" "$output\*" | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Could not create the release archive." }

      - name: Upload portable build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: InkMotion-win-${{ matrix.platform }}
          path: InkMotion-win-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 7

  store-package:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/windows-store-package.yml
    with:
      build-number: ${{ github.run_number }}
      skip-if-identity-missing: true
    secrets: inherit

  release:
    needs: [build-and-test, store-package]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-release
      cancel-in-progress: false
    steps:
      - name: Download portable builds
        uses: actions/download-artifact@v4
        with:
          pattern: InkMotion-win-*
          merge-multiple: true
          path: release

      - name: Download MSIX package
        if: needs.store-package.outputs.package-ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: InkMotion-Microsoft-Store
          path: store

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: build-${{ github.run_number }}
          STORE_PACKAGE_READY: ${{ needs.store-package.outputs.package-ready }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          for platform in x64 x86; do
            mv "release/InkMotion-win-${platform}.zip" "release/InkMotion-${TAG}-win-${platform}.zip"
          done
          msix_note="No MSIX package was built because the Microsoft Store repository secrets are not set."
          if [ "$STORE_PACKAGE_READY" = "true" ]; then
            mapfile -d '' uploads < <(find store -type f -name '*.msixupload' -print0)
            if [ "${#uploads[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one verified Store upload package; found ${#uploads[@]}."
              exit 1
            fi
            msix_name="InkMotion-${TAG}-x86-x64.msixupload"
            mv "${uploads[0]}" "release/${msix_name}"
            msix_note="**Microsoft Store update (manual submission):**

          1. Download \`${msix_name}\` from this release. It contains the x86 and x64 Store packages (package build ${{ github.run_number }}).
          2. In [Partner Center](https://partner.microsoft.com/dashboard), open InkMotion and create an update submission after the previous submission finishes processing.
          3. Upload the \`.msixupload\` under **Packages**, review the inherited listing and availability settings, and submit for certification.

          GitHub Actions builds and attaches the package automatically; it does **not** submit to or publish in the Microsoft Store. Microsoft signs the certified package; this upload file is not a direct installer."
          fi
          cat > notes.md <<EOF
          Automatic build of \`main\` at ${short_sha}, created after the x86 and x64 builds and tests passed.

          Download the zip for your PC (**x64** for most PCs, **x86** for 32-bit Windows), extract it, and run \`InkMotion.exe\`. The builds are self-contained and unsigned, so Windows SmartScreen may ask you to confirm before the first run.

          ${msix_note}
          EOF
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "InkMotion build ${{ github.run_number }} (${short_sha})" \
            --notes-file notes.md \
            --latest
          {
            echo "## Release ready"
            echo
            echo "[Open release ${TAG}](https://github.com/${GH_REPO}/releases/tag/${TAG})"
            echo
            echo "${msix_note}"
          } >> "$GITHUB_STEP_SUMMARY"
