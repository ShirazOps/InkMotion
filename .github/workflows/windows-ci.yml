name: Windows build and test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore InkMotion.sln

      - name: Build
        run: dotnet build InkMotion.sln -c Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test InkMotion.sln -c Release -p:Platform=x64 --no-build --no-restore
