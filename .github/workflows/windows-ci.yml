name: Windows build and test

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    strategy:
      matrix:
        platform: [x86, x64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up x86 .NET runtime
        if: matrix.platform == 'x86'
        shell: pwsh
        run: |
          $runtimePath = Join-Path $env:RUNNER_TEMP "dotnet-x86"
          $installerPath = Join-Path $env:RUNNER_TEMP "dotnet-install.ps1"
          Invoke-WebRequest https://dot.net/v1/dotnet-install.ps1 -OutFile $installerPath
          & $installerPath -Runtime dotnet -Channel 10.0 -Architecture x86 -InstallDir $runtimePath
          "DOTNET_ROOT_X86=$runtimePath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Restore
        run: dotnet restore InkMotion.sln -p:Platform=${{ matrix.platform }}

      - name: Build
        run: dotnet build InkMotion.sln -c Release -p:Platform=${{ matrix.platform }} --no-restore

      - name: Test
        run: dotnet test InkMotion.sln -c Release -p:Platform=${{ matrix.platform }} --no-build --no-restore
