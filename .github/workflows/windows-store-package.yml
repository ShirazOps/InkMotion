name: Microsoft Store package

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      build-number:
        description: Third part of the package version, for example the CI run number.
        type: string
        default: ""
      skip-if-identity-missing:
        description: Skip packaging with a warning when the Store secrets are not set.
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  create-store-package:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Check Microsoft Store secrets
        id: identity
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
          SKIP_IF_MISSING: ${{ inputs.skip-if-identity-missing }}
        run: |
          $missing = @('STORE_PACKAGE_NAME', 'STORE_PUBLISHER', 'STORE_PUBLISHER_DISPLAY_NAME') |
            Where-Object { [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_)) }
          if ($missing -and $env:SKIP_IF_MISSING -eq 'true') {
            Write-Host "::warning::Skipping the MSIX package because these repository secrets are not set: $($missing -join ', ')"
            "ready=false" >> $env:GITHUB_OUTPUT
          }
          else {
            "ready=true" >> $env:GITHUB_OUTPUT
          }

      - name: Apply Microsoft Store identity from secrets
        if: steps.identity.outputs.ready == 'true'
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
          STORE_PUBLISHER_DISPLAY_NAME: ${{ secrets.STORE_PUBLISHER_DISPLAY_NAME }}
          STORE_DISPLAY_NAME: ${{ secrets.STORE_DISPLAY_NAME }}
          STORE_PACKAGE_BUILD: ${{ inputs.build-number }}
        run: ./build/Set-StoreIdentity.ps1

      - name: Restore
        if: steps.identity.outputs.ready == 'true'
        run: msbuild src\InkMotion\InkMotion.csproj /t:Restore /p:Configuration=Release /p:Platform=x86 /p:StorePackage=true /p:AppxBundlePlatforms="x86|x64"

      # Keep runFullTrust in generated manifests; Store mode strips it before validation.
      - name: Build Store upload package
        if: steps.identity.outputs.ready == 'true'
        run: >
          msbuild src\InkMotion\InkMotion.csproj
          /p:Configuration=Release
          /p:Platform=x86
          /p:StorePackage=true
          /p:AppxBundlePlatforms="x86|x64"
          /p:AppxBundle=Always
          /p:UapAppxPackageBuildMode=StoreUpload
          /p:AppxPackageIsForStore=false
          /p:AppxPackageDir=Packages\
          /p:AppxPackageSigningEnabled=false
          /p:GenerateAppxPackageOnBuild=true

      - name: Verify packaged identity
        if: steps.identity.outputs.ready == 'true'
        shell: pwsh
        env:
          STORE_PACKAGE_NAME: ${{ secrets.STORE_PACKAGE_NAME }}
          STORE_PUBLISHER: ${{ secrets.STORE_PUBLISHER }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $upload = Get-ChildItem -Recurse -Filter *.msixupload | Where-Object FullName -like '*\Packages\*' | Select-Object -First 1
          if (-not $upload) { throw "No .msixupload was produced." }
          $work = Join-Path $env:RUNNER_TEMP 'store-verify'
          New-Item -ItemType Directory -Force $work | Out-Null
          [IO.Compression.ZipFile]::ExtractToDirectory($upload.FullName, $work, $true)
          $bundle = Get-ChildItem $work -Filter *.msixbundle | Select-Object -First 1
          [IO.Compression.ZipFile]::ExtractToDirectory($bundle.FullName, (Join-Path $work 'bundle'), $true)
          $packages = Get-ChildItem (Join-Path $work 'bundle') -Filter *.msix
          $architectures = @()
          foreach ($package in $packages) {
            $zip = [IO.Compression.ZipFile]::OpenRead($package.FullName)
            try {
              $reader = New-Object IO.StreamReader(($zip.Entries | Where-Object FullName -eq 'AppxManifest.xml').Open())
              [xml]$manifest = $reader.ReadToEnd()
              $reader.Dispose()
            }
            finally { $zip.Dispose() }
            $identity = $manifest.Package.Identity
            if ($identity.Name -ne $env:STORE_PACKAGE_NAME -or $identity.Publisher -ne $env:STORE_PUBLISHER) {
              throw "$($package.Name) does not carry the Store identity from the repository secrets."
            }
            if ($manifest.OuterXml -notmatch 'runFullTrust') { throw "$($package.Name) is missing runFullTrust." }
            $architectures += $identity.ProcessorArchitecture
          }
          if (($architectures | Sort-Object) -join ',' -ne 'x64,x86') {
            throw "Expected x86 and x64 packages, found $($architectures -join ', ')."
          }
          Write-Host "Verified $($upload.Name): $($architectures -join ', ')"

      - name: Upload Store package
        if: steps.identity.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: InkMotion-Microsoft-Store
          path: "**/Packages/**/*.msixupload"
          if-no-files-found: error
